# Online meeting profile. Selecting it is explicit and deliberate: this
# deployment sends audio and text to third-party providers. Omitting `profile`
# selects `offline`, and every other example in this directory is offline.
#
# Credentials are never written here. Each `credential_env` and `key_env` names
# an environment variable the operator sets before starting the gateway; the
# gateway refuses to start when a named variable is unset or empty.
#
# Model and voice identifiers below are placeholders. Substitute the ones the
# deployment's provider account actually offers.
schema_version = 3
profile = "online"
privacy_mode = "cloud"

[language]
backend = "openai-compatible"
execution = "remote"
provider = "openai"
endpoint = "https://api.openai.com/v1"
model = "operator-supplied-text-model"
credential_env = "OPENAI_API_KEY"
# Deployment policy only. Keep this public and backend-neutral.
system_prompt = "Describe only application capabilities explicitly present in the conversation. Never invent tabs, menus, settings, storage locations, or unavailable features."
thinking = false
temperature = 0.7
seed = 42
num_predict = 1024
num_ctx = 8192
max_assistant_content_bytes = 65536

[persona]
mode = "direct-answer"
warmth = 80
humor = 60
teasing = 40
initiative = 35
directness = 80
intimacy = 30
verbosity = 20
follow_up_frequency = 25

[voice]
# "external_gate" keeps listening and transcription running while a response is
# produced only for a segment the meeting client authorizes. "automatic"
# answers every finalized segment.
response_mode = "external_gate"

[voice.capture]
device = "system-default"

[voice.turn]
speech_start_ms = 200
final_silence_ms = 600

[voice.asr]
backend = "openai-streaming"
execution = "remote"
provider = "openai-streaming"
endpoint = "https://api.openai.com/v1"
model = "operator-supplied-transcription-model"
credential_env = "OPENAI_API_KEY"

[voice.speech]
backend = "openai-compatible"
execution = "remote"
provider = "openai-compatible-streaming"
mode = "streaming"
streaming_interval = 0.2
endpoint = "https://api.openai.com/v1"
model = "operator-supplied-tts-model"
voice = "operator-supplied-voice"
credential_env = "OPENAI_API_KEY"
speed = 1.0
language = "auto"
instructions = "Speak naturally and clearly."
max_tokens = 128
repetition_penalty = 1.05
max_text_bytes = 4096
max_audio_bytes = 8388608

# Audio capture and playback stay on the local sidecar in every profile.
[voice.audio]
backend = "managed-sidecar"
execution = "local"
provider = "local-audio"
sidecar_executable = "/absolute/path/to/conversation-voice-sidecar"
max_error_bytes = 65536

# Post-meeting speaker diarization. This is the one component an online meeting
# may deliberately keep on the machine that recorded it: `speechbrain-sidecar`
# clusters the speakers locally, so the recording is never sent anywhere, while
# `openai` sends each window to the provider named below. An offline deployment
# may only use the local backend.
#
# The sidecar is `platform/diarization-sidecar`. Installing it and fetching its
# model are human-gated steps; see docs/HUMAN-CHECKLIST.md. It loads only from
# `model_cache_dir` and never downloads. It clusters voices and does not
# transcribe, so its segments carry timings and a cluster and no text.
[voice.diarization]
backend = "speechbrain-sidecar"
execution = "local"
provider = "speechbrain"
sidecar_executable = "/absolute/path/to/diarization-sidecar/.venv/bin/diarization-sidecar"
model = "speechbrain/spkrec-ecapa-voxceleb"
model_cache_dir = "/absolute/path/to/diarization-model-cache"
max_speakers = 12

# The remote alternative, for a deployment that would rather a provider did the
# clustering. It replaces the section above; the two are never both configured.
#
# [voice.diarization]
# backend = "openai"
# execution = "remote"
# provider = "openai"
# endpoint = "https://api.openai.com/v1"
# model = "operator-supplied-diarization-model"
# credential_env = "OPENAI_API_KEY"

# Encrypted session recording. The directory holds ciphertext only and must be
# private to the account running the gateway. `key_env` names the variable
# holding the encryption key; the key is never written to this file, a status,
# a log line, or an error.
#
# The variable must hold a 256-bit key written as 64 hexadecimal characters.
# Generate one with `openssl rand -hex 32`, keep it out of shell history, and
# give the gateway process the variable through your service manager. A
# passphrase or any other short value is refused when a session starts: the
# recording's published key identifier is an unsalted digest of this value, so
# anything guessable would let a holder of the summary test candidates offline.
[recording]
directory = "/absolute/private/path/recordings"
key_env = "MEETING_RECORDING_KEY"

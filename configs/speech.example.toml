schema_version = 1
default_profile = "system-default"

[profiles.system-default]
backend = "macos-system"

[profiles.british-english]
backend = "macos-system"
voice = "Daniel"
rate_wpm = 190

[profiles.mandarin]
backend = "macos-system"
voice = "Tingting"
rate_wpm = 180

# Replace the model and voice with values supported by your loopback host.
# Exact MLX-Audio and Qwen identifiers are evaluation candidates, not SDK defaults.
[profiles.local-neural-fast]
backend = "openai-compatible"
endpoint = "http://127.0.0.1:8000/v1"
model = "local-model"
voice = "local-voice"
speed = 1.0
language = "Chinese"
instructions = "Warm and calm."
max_tokens = 128
repetition_penalty = 1.05

[profiles.local-neural-quality]
backend = "openai-compatible"
endpoint = "http://127.0.0.1:8000/v1"
model = "local-model"
voice = "local-voice"
speed = 1.0
language = "Chinese"
instructions = "Warm and calm."
max_tokens = 128
repetition_penalty = 1.05

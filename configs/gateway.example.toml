schema_version = 1
privacy_mode = "local-only"

[language]
backend = "ollama-compatible"
execution = "local"
provider = "local-language"
endpoint = "http://127.0.0.1:11434"
model = "local-model-id"
# Deployment policy only. Keep this public and backend-neutral.
system_prompt = "Describe only application capabilities explicitly present in the conversation. Never invent tabs, menus, settings, storage locations, or unavailable features."
thinking = false
temperature = 0.7
seed = 42
num_predict = 1024
num_ctx = 8192
max_assistant_content_bytes = 65536

[persona]
mode = "direct-answer"
warmth = 80
humor = 60
teasing = 40
initiative = 35
directness = 80
intimacy = 30
verbosity = 20
follow_up_frequency = 25

# Optional; when present, this file must already exist and be initialized.
# [memory]
# database = "/absolute/path/to/runtime.sqlite3"
# maximum_items = 4
# maximum_bytes = 4096

# Optional local voice composition. Loading this configuration validates these
# values but does not start capture, spawn the sidecar, or contact providers.
# [voice.capture]
# device = "system-default"
#
# [voice.turn]
# speech_start_ms = 200
# final_silence_ms = 600
#
# [voice.asr]
# backend = "whisperkit"
# execution = "local"
# provider = "local-speech-recognition"
# model_path = "/absolute/path/to/local-asr-model"
# download = false
# Optional: pin recognition to one lowercase Whisper language code (for
# example "zh" or "en"). When unset, the engine detects the language per
# window, which can drift on mixed-language or noisy audio.
# language = "zh"
#
# [voice.speech]
# backend = "openai-compatible"
# execution = "local"
# provider = "local-speech-synthesis"
# mode = "streaming"
# streaming_interval = 0.2
# endpoint = "http://127.0.0.1:8000/v1"
# model = "local-speech-model"
# voice = "local-voice"
# speed = 1.0
# language = "auto"
# instructions = "Speak naturally and clearly."
# max_tokens = 128
# repetition_penalty = 1.05
# max_text_bytes = 4096
# max_audio_bytes = 8388608
#
# [voice.audio]
# backend = "managed-sidecar"
# execution = "local"
# provider = "local-audio"
# sidecar_executable = "/absolute/path/to/conversation-voice-sidecar"
# max_error_bytes = 65536

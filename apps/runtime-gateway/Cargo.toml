[package]
name = "conversation-runtime-gateway"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
conversation-memory.workspace = true
conversation-model-adapters.workspace = true
conversation-protocol.workspace = true
conversation-runtime.workspace = true
futures-util.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
# Only the test-only scripted peers need a WebSocket server; the production binary is built
# without `scripted-providers`, so this is not compiled into it.
tokio-tungstenite = { workspace = true, optional = true }
toml.workspace = true

# Test-only. Enables the scripted provider entry (`conversation-runtime-gateway-scripted`)
# and its loopback peers. NEVER enable this for a deployed gateway.
[features]
# Compile-time-only private admission observations; never enable in deployed builds.
media-admission-evidence = []
scripted-providers = ["dep:tokio-tungstenite"]

[[bin]]
name = "conversation-runtime-gateway-scripted"
path = "src/bin/conversation-runtime-gateway-scripted.rs"
required-features = ["scripted-providers"]

[[bin]]
name = "conversation-runtime-scripted-peers"
path = "src/bin/conversation-runtime-scripted-peers.rs"
required-features = ["scripted-providers"]

[[test]]
name = "scripted_provider_entry"
path = "tests/scripted_provider_entry.rs"
required-features = ["scripted-providers"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
conversation-runtime = { workspace = true, features = ["recording-test-support"] }
ring.workspace = true
tempfile.workspace = true

[lints]
workspace = true

schema_version = 2

[privacy]
mode = "local-only"

[capture]
device = "system-default"

[turn]
speech_start_ms = 200
final_silence_ms = 600

[persona]
warmth = 0.8
humor = 0.6
teasing = 0.4
initiative = 0.35
directness = 0.8
intimacy = 0.3
verbosity = 0.2
follow_up_frequency = 0.25

[response]
mode = "direct-answer"
maximum_spoken_seconds = 20
pace = "natural"
allow_silence = true
ask_follow_up_by_default = false

[quality_metrics]
enabled = true
record_content = false

[asr]
backend = "whisperkit"
execution = "local"
provider = "local-asr"
model_path = "/opt/conversation-runtime/models/local-asr"
download = false

[language]
backend = "ollama"
execution = "local"
provider = "local-language"
endpoint = "http://127.0.0.1:11434"
model = "local-language-model"
thinking = false
temperature = 0.0
seed = 42
num_predict = 128
num_ctx = 8192
max_assistant_content_bytes = 65536

[speech]
backend = "openai-compatible"
execution = "local"
provider = "local-speech"
mode = "streaming"
streaming_interval = 0.32
endpoint = "http://127.0.0.1:8000/v1"
model = "local-speech-model"
voice = "local-voice"
speed = 1.0
language = "auto"
instructions = "Speak naturally and clearly."
max_tokens = 128
repetition_penalty = 1.05
max_text_bytes = 4096
max_audio_bytes = 8388608

[audio]
backend = "managed-sidecar"
execution = "local"
provider = "macos-system-audio"
# Optional development override. It must be absolute when present.
# sidecar_executable = "/opt/conversation-runtime/bin/conversation-voice-sidecar"
max_error_bytes = 65536

# Memory is disabled unless both blocks are explicitly enabled.
